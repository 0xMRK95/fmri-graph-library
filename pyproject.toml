[project]
name = "fmri-graph-library"
version = "0.1.0"
description = "Searchable literature corpus and citation network for graph and geometric learning in fMRI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13.7",
  "duckdb>=1.0",
  "pyyaml>=6.0",
  "networkx>=3.3",
]

[project.scripts]
fc = "field_cartography.cli:app"

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
ndex = ["ndex2>=3.12"]
visualization = ["igraph>=1.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
